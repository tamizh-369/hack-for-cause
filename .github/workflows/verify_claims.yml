name: Claim Watchdog Automated Verification CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run daily at 06:00 UTC to re-check datasets for published updates
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite (pytest)
        run: |
          python -m pytest -v

      - name: Run Core CLI Verification Pipeline
        run: |
          python src/cli.py en
